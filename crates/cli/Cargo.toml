[package]
name = "latex_notes_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "latex-notes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
latex_notes_core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
